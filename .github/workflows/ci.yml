name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate workflow JSON
        run: for f in workflows/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f'))" && echo "OK $f"; done

      - name: Run Code node tests
        run: node tests/code-nodes.test.js
